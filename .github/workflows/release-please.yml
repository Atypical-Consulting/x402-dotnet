name: release-please

# Derives the next semantic version from Conventional Commits on every push to main and keeps a
# release PR up to date (bumping the Directory.Build.props version shared by X402.Core,
# X402.AspNetCore and X402.Client via the x-release-please-version markers, plus CHANGELOG.md).
# Merging that PR tags vX.Y.Z and publishes the GitHub Release.
#
# The publish job below runs in THIS SAME workflow run, gated on `release_created`, rather than
# relying solely on ci.yml's own tag-triggered publish/release jobs: a tag pushed by
# release-please-action using the default GITHUB_TOKEN does not itself fire `on: push: tags` in
# another workflow — GitHub suppresses workflow runs recursively triggered by the default token,
# to prevent infinite loops. See
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
# ci.yml's tag-triggered jobs are kept as the path for a manually pushed v* tag (e.g. a hotfix);
# both are safe to run for the same tag since both the NuGet push (--skip-duplicate) and the
# release-asset upload (--clobber) are idempotent.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize release-please runs so two overlapping pushes to main can't race on the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packs and publishes the three packages for the release just created above, via NuGet Trusted
  # Publishing: the login step exchanges the GitHub OIDC token (needs `id-token: write` below) for
  # a short-lived key valid ~1h, so no long-lived secret is stored anywhere.
  #
  # Guarded on NUGET_USER (job-level env, read from a step-level `if`, since a step's own `if`
  # cannot see its own step-level env). The previous guard read NUGET_API_KEY and its comment
  # claimed "the secret does not exist yet" — that was verified with `gh secret list`, which shows
  # REPOSITORY secrets only. The organization has carried a NUGET_API_KEY since 2026-02-28
  # (`gh api repos/{owner}/{repo}/actions/organization-secrets`), so the guard resolved and the
  # push was armed, not a no-op. Measured before this change: repo secrets 0, repo variables 0,
  # org variables 0, org secrets = [NUGET_API_KEY]. NUGET_USER is therefore genuinely absent and
  # the no-op this job always claimed to have is now real.
  #
  # Re-verify with the API, never with `gh secret list`, before trusting this guard again.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the .nupkg files to the release created above
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      # Keep login adjacent to the push so the ~1h key doesn't expire before it's used.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        if: ${{ env.NUGET_USER != '' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ env.NUGET_USER != '' }}
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./nupkg/*.nupkg --clobber
