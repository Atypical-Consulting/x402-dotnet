name: release-please

# Derives the next semantic version from Conventional Commits on every push to main and keeps a
# release PR up to date (bumping the Directory.Build.props version shared by X402.Core,
# X402.AspNetCore and X402.Client via the x-release-please-version markers, plus CHANGELOG.md).
# Merging that PR tags vX.Y.Z and publishes the GitHub Release.
#
# The publish job below runs in THIS SAME workflow run, gated on `release_created`, rather than
# relying solely on ci.yml's own tag-triggered publish/release jobs: a tag pushed by
# release-please-action using the default GITHUB_TOKEN does not itself fire `on: push: tags` in
# another workflow — GitHub suppresses workflow runs recursively triggered by the default token,
# to prevent infinite loops. See
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
# ci.yml's tag-triggered jobs are kept as the path for a manually pushed v* tag (e.g. a hotfix);
# both are safe to run for the same tag since both the NuGet push (--skip-duplicate) and the
# release-asset upload (--clobber) are idempotent.

on:
  push:
    branches: [main]
  # Manual re-run: refreshes the release PR. It cannot finish a release whose publish job failed —
  # the tag already exists, so release_created is false and publish is skipped. Retry that with
  # "Re-run failed jobs" on the original run.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # release-please creates the `autorelease: pending` label it uses to find the merged release PR.
  issues: write

# Serialize release-please runs so two overlapping pushes to main can't race on the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packs and publishes the three packages for the release just created above, via NuGet Trusted
  # Publishing: the login step exchanges the GitHub OIDC token (needs `id-token: write` below) for
  # a short-lived key valid ~1h, so no long-lived API key is stored anywhere. Needs a trusted
  # publishing policy on nuget.org naming this repository and this workflow file
  # (release-please.yml), and the NUGET_USER repository secret (the nuget.org profile name).
  # Deliberately not skipped when the secret is missing: a release that was meant to publish and
  # could not must fail, not go green.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the .nupkg files to the release created above
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      # Keep login adjacent to the push so the ~1h key doesn't expire before it's used.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./nupkg/*.nupkg --clobber
