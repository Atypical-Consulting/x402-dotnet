name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      # The packed version comes from Directory.Build.props, never from the tag: a tag that
      # disagrees would push nothing (--skip-duplicate) and still attach stale packages.
      - name: Check the tag matches the packed version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "<Version>${GITHUB_REF_NAME#v}</Version>" Directory.Build.props \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg

  # The on-chain suite (tests/X402.OnChain.Tests) needs Docker and outbound HTTPS to a Base
  # Sepolia RPC: it forks the chain in an Anvil container and settles against Circle's real
  # FiatToken. It is opt-in (X402_ONCHAIN=1), so `build`'s own Test step reports it as skipped and
  # stays offline; this job runs it, in parallel with `build`.
  onchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X402_ONCHAIN: "1"
      X402_BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: On-chain tests (Anvil fork of Base Sepolia)
        run: dotnet test --project tests/X402.OnChain.Tests --configuration Release --verbosity normal

  # Publishes the three packages to NuGet.org for a manually pushed v* tag (e.g. a hotfix tagged
  # by hand). release-please.yml's own `publish` job is the primary path for a release-please
  # release — see its comment for why a release-please-created tag can't rely on this trigger
  # firing. --skip-duplicate makes running both for the same tag harmless. Both publish paths
  # also attest build provenance; two attestations for the same .nupkg digest are harmless too.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing (and Sigstore)
      attestations: write # record build provenance for the .nupkg files
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./nupkg/*.nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Trusted Publishing (OIDC): no long-lived secret. Needs its own nuget.org policy naming
      # ci.yml (a policy is per workflow file) plus the NUGET_USER secret; fails loudly rather than
      # going green when either is missing.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Attaches the .nupkg files to a GitHub Release for this tag, creating one if release-please
  # hasn't already (a manually pushed tag). Updates the existing release in place otherwise.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
