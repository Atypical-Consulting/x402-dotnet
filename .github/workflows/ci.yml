name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg

  # Publishes the three packages to NuGet.org for a manually pushed v* tag (e.g. a hotfix tagged
  # by hand). release-please.yml's own `publish` job is the primary path for a release-please
  # release — see its comment for why a release-please-created tag can't rely on this trigger
  # firing. --skip-duplicate makes running both for the same tag harmless.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing (OIDC): no long-lived secret. Job-level env, read from the step's own
      # `if`: a step-level env is not visible to that same step's `if` conditional.
      #
      # This guard used to read NUGET_API_KEY and claim the secret was "confirmed absent" — a
      # conclusion drawn from `gh secret list`, which shows REPOSITORY secrets only. An
      # organization NUGET_API_KEY has existed since 2026-02-28, so the guard resolved and this
      # push was armed. Both publish paths (here and release-please.yml) had to move together;
      # fixing only one would have left the other live. See release-please.yml for the full
      # measurement.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        if: ${{ env.NUGET_USER != '' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ env.NUGET_USER != '' }}
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Attaches the .nupkg files to a GitHub Release for this tag, creating one if release-please
  # hasn't already (a manually pushed tag). Updates the existing release in place otherwise.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
